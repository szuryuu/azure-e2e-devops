<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure E2E | System Status</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 40px;
            box-shadow: 0 0 20px #00ff41;
            text-align: center;
            background: rgba(0, 20, 0, 0.8);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff41;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .metric {
            border: 1px solid #00ff41;
            padding: 15px;
        }
        .value {
            font-size: 2em;
            font-weight: bold;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        .log-window {
            margin-top: 20px;
            height: 100px;
            overflow: hidden;
            border-top: 1px dashed #00ff41;
            text-align: left;
            font-size: 0.8em;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Azure Ops Center</h1>
        <p>SYSTEM STATUS: <span class="blink">ONLINE</span></p>
        <p>Environment: <strong style="color: cyan;">PRODUCTION</strong></p>

        <div class="status-grid">
            <div class="metric">
                <div>CPU LOAD</div>
                <div class="value" id="cpu">0%</div>
            </div>
            <div class="metric">
                <div>MEMORY</div>
                <div class="value" id="mem">0 TB</div>
            </div>
            <div class="metric">
                <div>REQUESTS/SEC</div>
                <div class="value" id="req">0</div>
            </div>
            <div class="metric">
                <div>THREAT LEVEL</div>
                <div class="value" style="color: red;">LOW</div>
            </div>
        </div>

        <div class="log-window" id="logs">
            > Initializing system...<br>
        </div>
    </div>

    <script>
        setInterval(() => {
            document.getElementById('cpu').innerText = Math.floor(Math.random() * 100) + '%';
            document.getElementById('mem').innerText = (Math.random() * 16).toFixed(1) + ' GB';
            document.getElementById('req').innerText = Math.floor(Math.random() * 5000);
            
            const logs = document.getElementById('logs');
            const newLog = document.createElement('div');
            const messages = ["Analyzing traffic...", "Optimizing database...", "Checking firewall...", "Syncing with Azure...", "Ping: 2ms"];
            newLog.innerText = "> " + messages[Math.floor(Math.random() * messages.length)];
            logs.prepend(newLog);
        }, 2000);
    </script>
