name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
# pull-requests: write

env:
  ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  # ARM_USE_OIDC: true
  
  # Variables
  TF_VAR_subscription_id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  TF_VAR_resource_group_name: "devops-intern-sandbox-rg-sandbox-sea"
  TF_VAR_project_name: "azure-e2e-devops"
  TF_VAR_location: "southeastasia"
  TF_VAR_key_vault_name: "rg-intern-devops"
  TF_VAR_allowed_ip: "0.0.0.0/0"
  TF_VAR_address_space: '["10.0.0.0/16"]'
  TF_VAR_address_prefixes: '["10.0.0.0/28"]'

jobs:
  terraform-destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add az login because cannot create "Federated Credential"
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: ./terraform


